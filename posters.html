<!DOCTYPE html>

<style>
/* ==========================================================================
   复刻规格说明
   画布        : 720 × 1020（约 1 : 1.417，与原型一致）
   四色体系    : 奶油纸 #EDE4D2 / 近黑 #17140F / 砖红 #C33A28 / 钴蓝 #1F4C9E
   标题字体    : "Arial Narrow" 700（压缩粗黑），配合 SVG textLength 两端撑满
   小字字体    : Helvetica / Arial 700 全大写
   质感        : feTurbulence 噪点 + multiply 叠加，模拟老印刷纸纹
   ========================================================================== */
*{box-sizing:border-box;}
:root{
  --cream:#EDE4D2;
  --ink:#17140F;
  --red:#C33A28;
  --blue:#1F4C9E;
  --w:720px;
  --h:1020px;
}
html,body{margin:0;}
body{
  padding:36px 18px 96px;
  background:#615B54;
  background-image:radial-gradient(circle at 50% -10%,#7C756C 0%,#4B4641 62%,#3B3733 100%);
  color:#EDE4D2;
  font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.head{max-width:1560px;margin:0 auto 34px;text-align:center;}
.head .kicker{font-size:11px;letter-spacing:.44em;opacity:.62;margin-bottom:10px;}
.head h1{margin:0 0 10px;font-size:clamp(20px,3.2vw,32px);font-weight:800;letter-spacing:.06em;}
.head p{margin:0 auto;max-width:56em;font-size:13px;line-height:1.85;opacity:.7;}
.head p b{color:#EDE4D2;opacity:1;}

.gallery{display:flex;flex-wrap:wrap;gap:34px 26px;justify-content:center;max-width:1560px;margin:0 auto;}
.plate{margin:0;width:720px;max-width:100%;}
.scaler{transform-origin:top left;}
.frame{
  position:relative;width:720px;height:1020px;overflow:hidden;
  box-shadow:0 20px 42px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.08) inset;
  outline:1px solid rgba(0,0,0,.3);
}
.poster{position:absolute;inset:0;overflow:hidden;background:var(--cream);color:var(--ink);}
.poster.dark{background:var(--ink);color:var(--cream);}

/* ---- 定位与文字工具类 ---- */
.a{position:absolute;}
p.a{margin:0;}
.tt{font-family:"Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.004em;}
.lbl{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.mono{font-family:Consolas,"SFMono-Regular",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.01em;}
.cap{text-transform:uppercase;}
.rule{background:currentColor;}

/* ---- 印刷噪点 ---- */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.3;mix-blend-mode:multiply;}

/* ---- 图注 ---- */
figcaption{margin-top:12px;display:flex;align-items:baseline;gap:10px;font-size:12px;letter-spacing:.18em;opacity:.9;}
figcaption b{font-size:15px;letter-spacing:0;opacity:.5;}
figcaption span{font-size:11px;letter-spacing:.04em;opacity:.5;}
</style>
</head>
<body>

<!-- 全局滤镜 / 渐变定义 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="grainF" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="sphereG" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#E47456"/>
      <stop offset="52%" stop-color="#C33A28"/>
      <stop offset="100%" stop-color="#7C2217"/>

</svg>

<script>
/* 等比缩放：每张海报固定 720×1020 设计尺寸，按容器宽度整体缩放，保证版式 1:1 不跑偏 */
(function(){
  var W=720,H=1020;
  function fit(){
    document.querySelectorAll('.plate').forEach(function(plate){
      var avail = plate.clientWidth || W;
      var k = Math.min(1, avail/W);
      var scaler = plate.querySelector('.scaler');
      scaler.style.transform = 'scale('+k+')';
      var box = plate.querySelector('.frame');
      box.style.marginBottom = (H*(k-1))+'px';
    });
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
